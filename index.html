<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr TV</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin-bottom: 20px; color: #e50914; }
        .search-container { margin-bottom: 30px; width: 100%; max-width: 600px; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border: none; border-radius: 4px; font-size: 16px; background-color: #222; color: white; }
        button { padding: 12px 24px; background-color: #e50914; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #b80710; }
        
        /* Video Container & Sandboxed Player */
        .video-container { width: 100%; max-width: 800px; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 30px; display: none; }
        iframe { width: 100%; height: 450px; border: none; }
        .ad-warning { background: #332200; border-left: 5px solid #ffcc00; padding: 10px; font-size: 14px; text-align: center; color: #ffcc00; }

        /* Grid Setup for Movie Posters */
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; width: 100%; max-width: 1000px; padding-top: 20px; }
        .movie-card { background: #222; border-radius: 6px; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
        .movie-card:hover { transform: scale(1.05); }
        .movie-card img { width: 100%; height: 225px; object-fit: cover; display: block; }
        .movie-card p { padding: 10px; margin: 0; font-size: 14px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Mr TV</h1>

    <div class="search-container">
        <input type="text" id="search-input" placeholder="Type a movie title and press Search...">
        <button onclick="searchMovies()">Search</button>
    </div>

    <!-- The Video Player Section -->
    <div class="video-container" id="player-container">
        <div class="ad-warning">💡 Tip: If ads bypass the browser block, use a tool like FetchV to download and watch smoothly.</div>
        <!-- Sandboxed iframe to prevent top-level redirects and unwanted popups -->
        <iframe id="video-player" src="" allowfullscreen sandbox="allow-forms allow-pointer-lock allow-same-origin allow-scripts"></iframe>
    </div>

    <!-- The Grid where results show up -->
    <div class="movie-grid" id="movie-display"></div>

    <script>
        // INSERT YOUR FREE OMDB API KEY BETWEEN THE QUOTES BELOW
        const OMDB_API_KEY = '16bae162'; 

        // OMDb requires a search query to show anything, so we show a default search on load
        window.onload = function() {
            if(OMDB_API_KEY === 'YOUR_OMDB_API_KEY_HERE') {
                alert("Please add your OMDb API key to line 53 of the code!");
                return;
            }
            fetchMovies(`https://omdbapi.com{OMDB_API_KEY}&s=Batman&type=movie`);
        };

        // Search functionality
        function searchMovies() {
            const query = document.getElementById('search-input').value;
            if (!query) return;
            fetchMovies(`https://omdbapi.com{OMDB_API_KEY}&s=${encodeURIComponent(query)}&type=movie`);
        }

        // Fetch data from OMDb and display it
        function fetchMovies(url) {
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    const grid = document.getElementById('movie-display');
                    grid.innerHTML = ''; // Clear previous results
                    
                    if (!data.Search) {
                        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">No movies found. Try another search!</p>';
                        return;
                    }

                    data.Search.forEach(movie => {
                        // Skip movies that don't have a valid poster image link
                        if (!movie.Poster || movie.Poster === 'N/A') return; 
                        
                        const card = document.createElement('div');
                        card.className = 'movie-card';
                        card.onclick = () => loadPlayer(movie.imdbID);
                        
                        card.innerHTML = `
                            <img src="${movie.Poster}" alt="${movie.Title}">
                            <p>${movie.Title} (${movie.Year})</p>
                        `;
                        grid.appendChild(card);
                    });
                })
                .catch(err => console.error("Error fetching data from OMDb:", err));
        }

        // Dynamically load the movie into the sandboxed player
        function loadPlayer(imdbId) {
            const container = document.getElementById('player-container');
            const player = document.getElementById('video-player');
            
            // VidSrc can read standard IMDb IDs directly!
            player.src = `https://vidsrc.to{imdbId}`;
            container.style.display = 'block'; // Make player visible
            window.scrollTo({ top: 0, behavior: 'smooth' }); // Scroll up to the video
        }
    </script>
</body>
</html>
