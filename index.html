    <script>
        // Paste your OMDb key cleanly between the single quotes below
        const OMDB_API_KEY = '16bae162'; 

        window.onload = function() {
            if(OMDB_API_KEY === 'YOUR_OMDB_API_KEY_HERE') {
                alert("Please add your OMDb API key inside the quotes!");
                return;
            }
            fetchMovies("https://omdbapi.com" + OMDB_API_KEY + "&s=Batman&type=movie");
        };

        function searchMovies() {
            const query = document.getElementById('search-input').value;
            if (!query) return;
            fetchMovies("https://omdbapi.com" + OMDB_API_KEY + "&s=" + encodeURIComponent(query) + "&type=movie");
        }

        function fetchMovies(url) {
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    const grid = document.getElementById('movie-display');
                    grid.innerHTML = ''; 
                    
                    if (!data.Search) {
                        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">No movies found. Try another search!</p>';
                        return;
                    }

                    data.Search.forEach(movie => {
                        if (!movie.Poster || movie.Poster === 'N/A') return; 
                        
                        const card = document.createElement('div');
                        card.className = 'movie-card';
                        card.onclick = () => loadPlayer(movie.imdbID);
                        
                        card.innerHTML = `
                            <img src="${movie.Poster}" alt="${movie.Title}">
                            <p>${movie.Title} (${movie.Year})</p>
                        `;
                        grid.appendChild(card);
                    });
                })
                .catch(err => console.error("Error fetching data from OMDb:", err));
        }

        function loadPlayer(imdbId) {
            const container = document.getElementById('player-container');
            const player = document.getElementById('video-player');
            
            player.src = "https://vidsrc.to" + imdbId;
            container.style.display = 'block'; 
            window.scrollTo({ top: 0, behavior: 'smooth' }); 
        }
    </script>
</body>
</html>
